<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TODO Demo — Átria Jr.</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-2: #273549;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #22c55e;
        --err: #ef4444;
        --border: #334155;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.4;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 { margin: 0; font-size: 18px; font-weight: 600; }
      header .token-pill {
        font-size: 12px;
        background: var(--panel-2);
        padding: 4px 10px;
        border-radius: 999px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 24px;
        max-width: 1100px;
        margin: 0 auto;
      }
      section.panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
      }
      section.panel h2 { margin: 0 0 12px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
      .row { display: flex; gap: 8px; margin-bottom: 8px; }
      input, button {
        font: inherit;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      input {
        flex: 1;
        background: var(--panel-2);
        color: var(--text);
      }
      button {
        background: var(--accent);
        color: #0f172a;
        font-weight: 600;
        border-color: var(--accent);
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      ul.todos { list-style: none; padding: 0; margin: 12px 0 0; }
      ul.todos li {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      ul.todos li.done { opacity: 0.55; text-decoration: line-through; }
      ul.todos li.late { border-color: var(--err); }
      ul.todos .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
      ul.todos .actions { margin-top: 8px; display: flex; gap: 6px; }
      ul.todos .actions button { font-size: 12px; padding: 4px 8px; }
      .log {
        background: #0b1220;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        max-height: 320px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .log .req { color: var(--accent); }
      .log .ok { color: var(--ok); }
      .log .err { color: var(--err); }
      .log .muted { color: var(--muted); }
      .empty { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <h1>TODO Demo — Átria Jr.</h1>
      <span class="token-pill" id="token-pill">sem token</span>
    </header>

    <main>
      <section class="panel">
        <h2>1. Conta</h2>
        <div class="row">
          <input id="email" type="email" placeholder="email@unicamp.br" />
          <input id="password" type="password" placeholder="senha (8+)" />
        </div>
        <div class="row">
          <button id="btn-register">Registrar</button>
          <button id="btn-login" class="secondary">Entrar</button>
          <button id="btn-logout" class="secondary">Sair</button>
        </div>

        <h2 style="margin-top: 20px;">2. Novo TODO</h2>
        <div class="row">
          <input id="todo-desc" placeholder="descrição" />
        </div>
        <div class="row">
          <input id="todo-deadline" type="datetime-local" />
          <button id="btn-create">Criar</button>
        </div>

        <h2 style="margin-top: 20px;">3. Minhas tarefas</h2>
        <div class="row">
          <button id="btn-refresh" class="secondary">Recarregar lista</button>
        </div>
        <ul class="todos" id="todo-list">
          <li class="empty">faça login pra ver suas tarefas</li>
        </ul>
      </section>

      <section class="panel">
        <h2>Console HTTP (didático)</h2>
        <div class="log" id="log"></div>
      </section>
    </main>

    <script>
      const API = "/api";
      let token = localStorage.getItem("demo_token") || null;

      const $ = (id) => document.getElementById(id);
      const log = $("log");
      const tokenPill = $("token-pill");

      function refreshTokenPill() {
        tokenPill.textContent = token
          ? "token: " + token.slice(0, 14) + "…"
          : "sem token";
      }
      refreshTokenPill();

      function appendLog(kind, label, payload) {
        const block = document.createElement("div");
        const time = new Date().toLocaleTimeString();
        block.innerHTML =
          '<span class="muted">[' + time + "] </span>" +
          '<span class="' + kind + '">' + label + "</span>" +
          (payload ? "\n" + JSON.stringify(payload, null, 2) : "");
        log.prepend(block);
      }

      async function api(method, path, body) {
        const headers = { "Content-Type": "application/json" };
        if (token) headers["authorization"] = token;
        appendLog("req", method + " " + path, body || undefined);
        try {
          const res = await fetch(API + path, {
            method,
            headers,
            body: body ? JSON.stringify(body) : undefined,
          });
          const data = await res.json().catch(() => ({}));
          appendLog(res.ok ? "ok" : "err", res.status + " " + res.statusText, data);
          return { ok: res.ok, status: res.status, data };
        } catch (err) {
          appendLog("err", "fetch falhou", { message: String(err) });
          return { ok: false, status: 0, data: null };
        }
      }

      function renderTodos(items) {
        const ul = $("todo-list");
        ul.innerHTML = "";
        if (!items || items.length === 0) {
          ul.innerHTML = '<li class="empty">nenhuma tarefa ainda</li>';
          return;
        }
        for (const t of items) {
          const li = document.createElement("li");
          if (t.statusconclusion) li.classList.add("done");
          if (t.isPastDeadline && !t.statusconclusion) li.classList.add("late");
          const deadline = new Date(t.deadline).toLocaleString();
          li.innerHTML =
            "<div><strong>" + escapeHtml(t.description) + "</strong></div>" +
            '<div class="meta">prazo: ' + deadline +
            (t.isPastDeadline ? " (atrasado)" : "") + "</div>" +
            '<div class="actions">' +
              '<button data-id="' + t.todoId + '" class="edit secondary">Renomear</button>' +
              '<button data-id="' + t.todoId + '" class="close">Concluir</button>' +
            "</div>";
          ul.appendChild(li);
        }
        ul.querySelectorAll("button.edit").forEach((b) => {
          b.addEventListener("click", async () => {
            const novo = prompt("Nova descrição:");
            if (!novo) return;
            await api("PUT", "/TODO/edit", { todoId: b.dataset.id, newDescription: novo });
            loadTodos();
          });
        });
        ul.querySelectorAll("button.close").forEach((b) => {
          b.addEventListener("click", async () => {
            await api("PUT", "/TODO/close", { todoId: b.dataset.id });
            loadTodos();
          });
        });
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );
      }

      async function loadTodos() {
        if (!token) {
          renderTodos([]);
          return;
        }
        const res = await api("GET", "/TODO");
        if (res.ok) {
          renderTodos(res.data.result);
        } else if (res.status === 401) {
          token = null;
          localStorage.removeItem("demo_token");
          refreshTokenPill();
          renderTodos([]);
          appendLog("muted", "token inválido descartado — faça login de novo");
        }
      }

      $("btn-register").addEventListener("click", async () => {
        const email = $("email").value.trim();
        const password = $("password").value;
        await api("POST", "/register", { email, password });
      });

      $("btn-login").addEventListener("click", async () => {
        const email = $("email").value.trim();
        const password = $("password").value;
        const res = await api("POST", "/login", { email, password });
        if (res.ok && res.data.token) {
          token = res.data.token;
          localStorage.setItem("demo_token", token);
          refreshTokenPill();
          loadTodos();
        }
      });

      $("btn-logout").addEventListener("click", () => {
        token = null;
        localStorage.removeItem("demo_token");
        refreshTokenPill();
        renderTodos([]);
        appendLog("muted", "sessão encerrada (token removido)");
      });

      $("btn-create").addEventListener("click", async () => {
        const description = $("todo-desc").value.trim();
        const raw = $("todo-deadline").value;
        if (!description || !raw) {
          appendLog("err", "preencha descrição e prazo");
          return;
        }
        const deadline = new Date(raw).toISOString();
        const res = await api("POST", "/TODO/create", { description, deadline });
        if (res.ok) {
          $("todo-desc").value = "";
          loadTodos();
        }
      });

      $("btn-refresh").addEventListener("click", loadTodos);

      loadTodos();
    </script>
  </body>
</html>
